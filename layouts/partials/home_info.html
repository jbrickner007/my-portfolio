{{- with site.Params.homeInfoParams }}
<style>
    .first-entry.home-info {
        width: 100vw;
        position: relative;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
        padding: 60px 8vw;
        box-sizing: border-box;
        margin-top: 0;
        margin-bottom: 60px;
        background: transparent;
    }
    .home-layout {
        display: flex;
        gap: 80px;
        align-items: center;
        max-width: 1400px;
        width: 100%;
        margin: 0 auto;
    }
    .home-image-container {
        flex: 0 0 45%;
        max-width: 600px;
    }
    .home-image {
        width: 100%;
        height: auto;
        border-radius: 24px;
        object-fit: cover;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }
    .home-content {
        flex: 1;
        font-size: 1.2rem;
    }
    .home-content .entry-header h1 {
        margin-top: 0;
        font-size: 3.5rem;
        margin-bottom: 20px;
    }
    @media (max-width: 992px) {
        .home-layout {
            flex-direction: column;
            gap: 40px;
        }
        .home-image-container {
            flex: 0 0 auto;
            width: 90%;
        }
        .home-content .entry-header h1 {
            font-size: 2.5rem;
        }
    }
</style>

<article class="first-entry home-info">
    <div class="home-layout">
        <!-- Left Side: Image -->
        <div class="home-image-container">
            <img src="/headshot.jpeg" alt="Headshot" class="home-image">
        </div>
        
        <!-- Right Side: Content -->
        <div class="home-content">
            <header class="entry-header">
                <h1>{{ .Title | markdownify }}</h1>
            </header>
            <div class="entry-content md-content">
                {{ $opts := dict "display" "block" }}
                {{ .Content | $.Page.RenderString $opts }}
            </div>
            <footer class="entry-footer">
                {{ partial "social_icons.html" (dict "align" site.Params.homeInfoParams.AlignSocialIconsTo) }}
            </footer>
        </div>
    </div>
</article>
{{- end -}}
